<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('パスワード変更')}"></head>
<body>
    <header th:replace="~{fragments/common :: nav}"></header>
    <main class="container mt-4 mb-5">
        <h1 class="h3 mb-4">パスワード変更</h1>
        <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/account/password/edit}" th:object="${editPasswordForm}" method="post">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>
            <div class="mb-3">
                <label class="form-label" for="newPassword">新しいパスワード</label>
                <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}"
                    th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="reNewPassword">新しいパスワード（再入力）</label>
                <input type="password" class="form-control" id="reNewPassword" th:field="*{reNewPassword}"
                    th:classappend="${#fields.hasErrors('reNewPassword') or #fields.hasErrors('samePassword')} ? 'is-invalid'" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('reNewPassword')}" th:errors="*{reNewPassword}"></div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('samePassword')}" th:errors="*{samePassword}"></div>
            </div>

            <input type="hidden" th:field="*{versionNo}">

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">変更する</button>
                <a class="btn btn-secondary" th:href="@{/}">キャンセル</a>
            </div>
        </form>
    </main>
</body>
</html>
