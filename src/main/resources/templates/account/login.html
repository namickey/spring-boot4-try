<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('ログイン')}"></head>
<body>
    <header th:replace="~{fragments/common :: nav}"></header>
    <main class="container mt-4 mb-5">
        <h1 class="h3 mb-4">ログイン</h1>
        <div class="alert alert-danger" th:if="${param.locked}" th:text="#{ME902}"></div>
        <div class="alert alert-danger" th:if="${param.error}" th:text="#{ME903}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">ユーザー名</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">パスワード</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">ログイン</button>
                <a class="btn btn-secondary" th:href="@{/}">キャンセル</a>
            </div>
        </form>
    </main>
</body>
</html>
