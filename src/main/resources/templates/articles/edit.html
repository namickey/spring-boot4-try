<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('記事編集')}"></head>
<body>
    <header th:replace="~{fragments/common :: nav}"></header>
    <main class="container mt-4 mb-5">
        <h1 class="h3 mb-4">記事編集</h1>
        <form th:action="@{'/articles/' + ${article.id} + '/edit'}" th:object="${article}" method="post">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>
            <div class="mb-3">
                <label class="form-label" for="title">タイトル</label>
                <input type="text" class="form-control" id="title" th:field="*{title}"
                    th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="content">本文</label>
                <textarea class="form-control" id="content" th:field="*{content}" rows="8"
                    th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'" required></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
            </div>

            <input type="hidden" th:field="*{versionNo}">

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">更新する</button>
                <a class="btn btn-secondary" th:href="@{'/articles/' + ${article.id}}">キャンセル</a>
            </div>
        </form>
    </main>
</body>
</html>
