<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('パスワード変更')}"></head>
<body>
    <header th:replace="~{fragments/common :: nav}"></header>
    <main class="container mt-4 mb-5">
        <h1 class="h3 mb-4">パスワード変更</h1>
        <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
        
        <form th:action="@{/account/password/edit}" th:object="${password}" method="post">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>
            <div class="mb-3">
                <label class="form-label" for="title">新しいパスワード</label>
                <input type="text" class="form-control" id="newPassword" th:field="*{newPassword}" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="content">新しいパスワード（再入力）</label>
                <input type="text" class="form-control" id="reNewPassword" th:field="*{reNewPassword}" required>
            </div>

            <input type="hidden" th:field="*{versionNo}">

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">変更する</button>
                <a class="btn btn-secondary" th:href="@{/}">キャンセル</a>
            </div>
        </form>
    </main>
</body>
</html>
